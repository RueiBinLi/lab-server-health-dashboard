name: lab-server-health

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-server-health-dashboard:0.1.0
    network_mode: host
    environment:
      DASHBOARD_DB_PATH: /var/lib/lab-dashboard/dashboard.sqlite3
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_PORT: "${DASHBOARD_PORT:-3000}"
      DASHBOARD_TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128
      DASHBOARD_PROMETHEUS_URL: http://127.0.0.1:19090
      DASHBOARD_PUBLIC_URL: "${DASHBOARD_PUBLIC_URL:-http://127.0.0.1:3000}"
      DASHBOARD_AUTH_MODE: "${DASHBOARD_AUTH_MODE:-capabilities}"
      DASHBOARD_LAB_ADMINISTRATOR_LOGINS: "${DASHBOARD_LAB_ADMINISTRATOR_LOGINS:-}"
      DASHBOARD_LAB_USER_LOGINS: "${DASHBOARD_LAB_USER_LOGINS:-}"
    volumes:
      - dashboard-data:/var/lib/lab-dashboard
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,os,urllib.request;
          response=urllib.request.urlopen(
          'http://127.0.0.1:'+os.environ['DASHBOARD_PORT']+'/health/ready',
          timeout=2);
          assert response.status == 200;
          assert json.load(response) == {'status':'ready'}
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128

  alertmanager-config:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-server-health-dashboard:0.1.0
    user: "0:0"
    network_mode: none
    command:
      - python
      - -m
      - lab_dashboard.alerting
      - --output-directory
      - /var/lib/lab-dashboard
    environment:
      ALERT_SMTP_SMARTHOST: "${ALERT_SMTP_SMARTHOST:?required}"
      ALERT_SMTP_FROM: "${ALERT_SMTP_FROM:?required}"
      ALERT_SMTP_TO: "${ALERT_SMTP_TO:?required}"
      ALERT_SMTP_USERNAME: "${ALERT_SMTP_USERNAME:?required}"
      ALERT_SMTP_PASSWORD_FILE: /run/secrets/smtp-password
      ALERT_SLACK_WEBHOOK_FILE: /run/secrets/slack-webhook
    volumes:
      - dashboard-data:/var/lib/lab-dashboard
      - type: bind
        source: "${ALERT_SMTP_PASSWORD_PATH:?required}"
        target: /run/secrets/smtp-password
        read_only: true
      - type: bind
        source: "${ALERT_SLACK_WEBHOOK_PATH:?required}"
        target: /run/secrets/slack-webhook
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    user: "0:0"
    network_mode: host
    command:
      - --config.file=/var/lib/lab-dashboard/alertmanager.yml
      - --storage.path=/var/lib/lab-dashboard/alertmanager-data
      - --web.listen-address=127.0.0.1:19093
    volumes:
      - dashboard-data:/var/lib/lab-dashboard
      - type: bind
        source: "${ALERT_SMTP_PASSWORD_PATH:?required}"
        target: /run/secrets/smtp-password
        read_only: true
      - type: bind
        source: "${ALERT_SLACK_WEBHOOK_PATH:?required}"
        target: /run/secrets/slack-webhook
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128

  prometheus:
    image: prom/prometheus:v3.11.3-distroless@sha256:cff72a3f49918f41c4b5c8a6174dd8433036bebf7878120da538b3720ba3fa0d
    network_mode: host
    command:
      - --config.file=/var/lib/lab-dashboard/prometheus.yml
      - --storage.tsdb.path=/var/lib/lab-dashboard/prometheus-data
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:19090
      - --web.enable-lifecycle
    volumes:
      - dashboard-data:/var/lib/lab-dashboard
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      dashboard:
        condition: service_healthy
      alertmanager:
        condition: service_started
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 256

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-server-health-dashboard:0.1.0
    user: "0:0"
    network_mode: none
    profiles: ["operations"]
    entrypoint: ["python", "-m", "lab_dashboard.operations"]
    command:
      - backup
      - --state-directory
      - /var/lib/lab-dashboard
      - --destination
      - /var/backups/lab-server-health
      - --recipient-file
      - /run/secrets/backup-recipients
    volumes:
      - dashboard-data:/var/lib/lab-dashboard:ro
      - type: bind
        source: "${BACKUP_DESTINATION:?required}"
        target: /var/backups/lab-server-health
      - type: bind
        source: "${BACKUP_RECIPIENTS_PATH:?required}"
        target: /run/secrets/backup-recipients
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

  operations-status:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-server-health-dashboard:0.1.0
    user: "0:0"
    network_mode: host
    profiles: ["operations"]
    entrypoint: ["python", "-m", "lab_dashboard.operations"]
    command:
      - status
      - --state-directory
      - /var/lib/lab-dashboard
      - --backup-directory
      - /var/backups/lab-server-health
    volumes:
      - dashboard-data:/var/lib/lab-dashboard:ro
      - type: bind
        source: "${BACKUP_DESTINATION:?required}"
        target: /var/backups/lab-server-health
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

volumes:
  dashboard-data:
